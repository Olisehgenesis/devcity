services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: devcity
      POSTGRES_USER: devcity
      POSTGRES_PASSWORD: devcity_dev_password
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - devcity-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devcity -d devcity"]
      interval: 5s
      timeout: 3s
      retries: 15

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - BETTER_AUTH_URL=https://devcity.fun
      - DOTENV_PRIVATE_KEY=6fcbd35b9fe2858d30843e3cfc66e45b27196b24130bd1b26f294435318eb63b
      - DATABASE_URL=postgresql://devcity:devcity_dev_password@postgres:5432/devcity?schema=public
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./.env:/app/.env:ro
      - ./scripts/dotenvx-preload.cjs:/app/scripts/dotenvx-preload.cjs:ro
    command: ["node", "-r", "./scripts/dotenvx-preload.cjs", "server.js"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  devcity-postgres: