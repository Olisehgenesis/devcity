services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: devcity
      POSTGRES_USER: devcity
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your dotenvx environment}
    ports:
      - "55432:5432"
    volumes:
      - devcity-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devcity -d devcity"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  devcity-postgres: